<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PH Works Admin</title>
<style>
  :root { --bg:#f5f6f7; --card:#fff; --ink:#1c2227; --muted:#667078; --line:#dde1e4; --accent:#0b5fa5; --new:#c2410c; --prog:#a16207; --done:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181b; --card:#1d2327; --ink:#e8ecef; --muted:#98a3ab; --line:#2f383e; --accent:#5aa9e6; --new:#fb923c; --prog:#facc15; --done:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.3rem; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .who { color:var(--muted); font-size:.9rem; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  input[type=email] { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .login { max-width:380px; margin:12vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px; }
  .login p { color:var(--muted); margin:.4rem 0 1rem; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .tabs button[aria-selected=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px; }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .top strong { font-size:1.05rem; }
  .date { color:var(--muted); font-size:.85rem; }
  dl { margin:0; display:grid; grid-template-columns:110px 1fr; gap:3px 10px; }
  dt { color:var(--muted); font-size:.9rem; }
  dd { margin:0; word-break:break-word; white-space:pre-wrap; }
  .files { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .files button { padding:5px 10px; font-size:.85rem; }
  .ctl { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start; }
  select, textarea { border:1px solid var(--line); border-radius:6px; padding:7px; background:var(--card); }
  textarea { flex:1; min-width:200px; min-height:38px; resize:vertical; }
  .s-new { color:var(--new); } .s-in-progress { color:var(--prog); } .s-done { color:var(--done); }
  .msg { color:var(--muted); padding:20px 0; }
  .err { color:#b91c1c; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  input[type=text] { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  details.row summary { cursor:pointer; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.live { color:var(--done); border-color:var(--done); }
  .edit { margin-top:12px; display:grid; gap:12px; }
  .fld { display:grid; gap:4px; } .fld > span { color:var(--muted); font-size:.9rem; }
  .fld select, .fld textarea { width:100%; }
  .fld input[type=text] { margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .thumb { display:grid; gap:6px; }
  .thumb img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .chk { display:flex; align-items:center; gap:8px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .date.err { color:#b91c1c; }
  /* Service: message preview on the closed card */
  details.row summary .snip { flex-basis:100%; color:var(--muted); font-size:.9rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
  details[open] > summary .snip { display:none; }
  /* Projects: drag to reorder */
  .grip { color:var(--muted); letter-spacing:-2px; user-select:none; }
  .dragsum { cursor:grab; }
  .dragsum:active { cursor:grabbing; }
  .thumb img { cursor:grab; }
  .thumb img:active { cursor:grabbing; }
  .dragging { opacity:.4; }
  .dragsum, .thumb img { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .drop-before { box-shadow:0 -4px 0 var(--accent); }
  .drop-after { box-shadow:0 4px 0 var(--accent); }
  .thumbs .drop-before { box-shadow:-6px 0 0 var(--accent); }
  .thumbs .drop-after { box-shadow:6px 0 0 var(--accent); }
</style>
</head>

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n; // text is always inserted as text, never as HTML
}

function showLogin(note) {

async function loadView(v, list) {

  if (!data.length) return list.replaceChildren(el('p', { class:'msg' }, 'Nothing here yet.'));

}

// Drag to reorder. Mouse: grab the handle (project header bar, or the photo) and drop it.
// Phone/tablet: press and hold the handle for a moment, then drag; scrolling still works as normal.
function makeDraggable(node, handle) {
  // Mouse: native drag and drop. Only armed for mouse so it can't fight with touch.
  handle.addEventListener('pointerdown', e => handle.setAttribute('draggable', e.pointerType === 'mouse' ? 'true' : 'false'));
  handle.addEventListener('dragstart', e => {
    const parent = node.parentElement;
    if (!parent || parent.orderBusy) { e.preventDefault(); return; }
    e.stopPropagation();
    parent.dragItem = node;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', node.dataset.id);
    if (node.tagName !== 'DETAILS') {
      const r = node.getBoundingClientRect();
      e.dataTransfer.setDragImage(node, e.clientX - r.left, e.clientY - r.top);
    }
    setTimeout(() => node.classList.add('dragging'), 0);
  });
  handle.addEventListener('dragend', () => {
    node.classList.remove('dragging');
    const parent = node.parentElement;
    if (parent) { parent.dragItem = null; parent.clearMarks(); }
  });

  // Touch: long-press, then drag
  let timer = null, active = false, sx = 0, sy = 0, lx = 0, ly = 0, scroller = null, hit = null, lastTouch = 0;
  const refresh = () => {
    const parent = node.parentElement;
    if (!parent) return;
    parent.clearMarks();
    hit = parent.locateAt(parent.dragItem, document.elementFromPoint(lx, ly), lx, ly);
    if (hit) hit.target.classList.add(hit.after ? 'drop-after' : 'drop-before');
  };
  const finish = (drop) => {
    clearTimeout(timer); timer = null;
    clearInterval(scroller); scroller = null;
    const parent = node.parentElement;
    if (active) {
      node.classList.remove('dragging');
      if (parent) { parent.clearMarks(); parent.dragItem = null; }
      if (drop && hit && parent) parent.moveItem(hit.node, hit.target, hit.after);
    }
    active = false; hit = null;
  };
  handle.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return finish(false);
    const parent = node.parentElement;
    if (!parent || parent.orderBusy) return;
    lastTouch = Date.now();
    sx = lx = e.touches[0].clientX; sy = ly = e.touches[0].clientY;
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null; active = true;
      parent.dragItem = node;
      node.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(15);
      // keep scrolling the page while the finger rests near the top or bottom edge
      scroller = setInterval(() => {
        const edge = 70, h = window.innerHeight;
        if (ly < edge) window.scrollBy(0, -Math.ceil((edge - ly) / 5));
        else if (ly > h - edge) window.scrollBy(0, Math.ceil((ly - (h - edge)) / 5));
        refresh();
      }, 30);
      refresh();
    }, 350);
  }, { passive:true });
  handle.addEventListener('touchmove', e => {
    const t = e.touches[0];
    lx = t.clientX; ly = t.clientY;
    if (active) { if (e.cancelable) e.preventDefault(); refresh(); return; }
    // moved before the hold finished: the person is just scrolling
    if (timer && Math.hypot(lx - sx, ly - sy) > 10) { clearTimeout(timer); timer = null; }
  }, { passive:false });
  handle.addEventListener('touchend', e => {
    const was = active;
    finish(true);
    if (was && e.cancelable) e.preventDefault(); // don't let the release count as a tap (it would open/close the card)
  });
  handle.addEventListener('touchcancel', () => finish(false));
  handle.addEventListener('contextmenu', e => { if (Date.now() - lastTouch < 2000) e.preventDefault(); });
}
function enableOrdering(parent, table, horizontal) {
  parent.clearMarks = () => [...parent.children].forEach(i => i.classList.remove('drop-before', 'drop-after'));
  // Which sibling is under the pointer/finger, and is the drop before or after it?
  parent.locateAt = (node, under, x, y) => {
    const target = under && [...parent.children].find(item => item.contains(under));
    if (!node || !target || target === node) return null;
    const r = target.getBoundingClientRect();
    const after = horizontal ? x > r.left + r.width / 2 : y > r.top + r.height / 2;
    return { node, target, after };
  };
  parent.moveItem = async (node, target, after) => {
    if (parent.orderBusy || node === target) return;
    const previous = [...parent.children];
    parent.insertBefore(node, after ? target.nextSibling : target);
    parent.orderBusy = true;
    try {
      for (const [index, item] of [...parent.children].entries()) {
        const { error } = await sb.from(table).update({ sort_order:index }).eq('id', item.dataset.id);
        if (error) throw error;
      }
    } catch(e) {
      previous.forEach(item => parent.append(item));
      alert('Order could not be fully saved: ' + e.message + '. Reload before trying again.');
    } finally { parent.orderBusy = false; }
  };
  parent.addEventListener('dragover', e => {
    if (!parent.dragItem) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    parent.clearMarks();
    const hit = parent.locateAt(parent.dragItem, e.target, e.clientX, e.clientY);
    if (hit) hit.target.classList.add(hit.after ? 'drop-after' : 'drop-before');
  });
  parent.addEventListener('dragleave', e => { if (!parent.contains(e.relatedTarget)) parent.clearMarks(); });
  parent.addEventListener('drop', e => {
    if (!parent.dragItem) return;
    e.preventDefault(); e.stopPropagation();
    const hit = parent.locateAt(parent.dragItem, e.target, e.clientX, e.clientY);
    parent.clearMarks();
    parent.dragItem = null;
    if (hit) parent.moveItem(hit.node, hit.target, hit.after);
  });
}

// Shrinks a photo to max 1800px JPEG so uploads are fast and stay under the 5 MB limit
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const r = Math.min(1, 1800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? ok(b) : bad(new Error('could not convert')); }, 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(u); bad(new Error('could not read it (try a JPG or PNG)')); };
    im.src = u;
  });
}

const field = (label, ctl) => el('label', { class:'fld' }, el('span', {}, label), ctl);
const kindOpts = (cur) => KINDS.map(([v, l]) => { const o = el('option', { value:v }, l); if (v === cur) o.selected = true; return o; });

// A dropdown with N/A first and "Other (type your own)" last. get() returns the chosen text, or null for N/A.
function choice(label) {
  const sel = el('select', { 'aria-label':label });
  const txt = el('input', { type:'text', placeholder:'Type your own…', 'aria-label':label + ' (your own)' });
  txt.style.display = 'none';
  const sync = () => { txt.style.display = sel.value === OTHER ? '' : 'none'; };
  sel.addEventListener('change', sync);
  return {
    node: el('div', { class:'fld' }, el('span', {}, label), sel, txt),
    set(list, cur) {
      sel.replaceChildren(
        el('option', { value:'' }, 'N/A'),
        ...list.map(v => el('option', { value:v }, v)),
        el('option', { value:OTHER }, 'Other (type your own)'));
      txt.value = '';
      if (cur && list.includes(cur)) sel.value = cur;
      else if (cur) { sel.value = OTHER; txt.value = cur; }
      else sel.value = '';
      sync();
    },
    get() { return sel.value === OTHER ? (txt.value.trim() || null) : (sel.value || null); },
    onchange(fn) { sel.addEventListener('change', fn); },
  };
}

async function renderProjects(list) {
  const request = Symbol(); list.request = request;
  list.replaceChildren(el('p', { class:'msg' }, 'Loading…'));
  const [p, ph] = await Promise.all([
    sb.from('projects').select('*').order('created_at', { ascending:false }),
    sb.from('project_photos').select('*').order('created_at', { ascending:true }),
  ]);
  if (list.request !== request) return;
  const err = p.error || ph.error;
  const ordered = rows => rows.sort((a,b) => (a.sort_order ?? 2147483647) - (b.sort_order ?? 2147483647));
  if (!err) { ordered(p.data); ordered(ph.data); }
  if (err) return list.replaceChildren(el('p', { class:'msg err' }, 'Could not load projects: ' + err.message));
  const by = {};
  ph.data.forEach(x => (by[x.project_id] = by[x.project_id] || []).push(x));

  const box = el('div');
  const empty = el('p', { class:'msg' }, 'No projects yet. Click “New project” to add one.');
  const sync = () => { empty.style.display = box.children.length ? 'none' : ''; };
  enableOrdering(box, 'projects', false);
  p.data.forEach(x => box.append(projectCard(x, by[x.id] || [], false, sync)));

  const add = el('button', { onclick: async () => {
    const { data, error } = await sb.from('projects').insert({ title:'New project', published:false }).select().single();
    if (error) return alert('Could not create: ' + error.message);
    const card = projectCard(data, [], true, sync);
    box.prepend(card); sync();
    card.scrollIntoView({ block:'nearest' });
  }}, '+ New project');

  list.replaceChildren(el('div', { style:'margin-bottom:12px' }, add), box, empty);
  sync();
}

function thumb(pic, onGone) {
  const caption = el('textarea', { rows:'2', placeholder:'Photo description', 'aria-label':'Photo description', style:'min-width:0;width:100%' });
  caption.value = pic.caption || '';
  const captionMsg = el('span', { class:'date' });
  caption.addEventListener('blur', async () => {
    if (caption.value === (pic.caption || '')) return;
    caption.disabled = true; captionMsg.textContent = 'Saving…';
    try {
      const { error } = await sb.from('project_photos').update({ caption:caption.value }).eq('id', pic.id);
      if (error) throw error;
      pic.caption = caption.value; captionMsg.textContent = 'Saved';
    } catch(e) { captionMsg.textContent = 'Not saved: ' + e.message; }
    finally { caption.disabled = false; }
  });
  const k = el('select', { 'aria-label':'Photo label' }, kindOpts(pic.kind));
  k.addEventListener('change', async () => {
    const { error } = await sb.from('project_photos').update({ kind:k.value }).eq('id', pic.id);
    if (error) alert('Could not change label: ' + error.message);
  });
  const del = el('button', { class:'ghost', onclick: async () => {
    if (!confirm('Delete this photo?')) return;
    await sb.storage.from(BUCKET).remove([pic.path]);
    const { error } = await sb.from('project_photos').delete().eq('id', pic.id);
    if (error) return alert('Could not delete: ' + error.message);
    t.remove(); onGone(pic);
  }}, 'Delete');
  const img = el('img', { src:pubUrl(pic.path), alt:'', loading:'lazy', title:'Drag to change the order' });
  const t = el('div', { class:'thumb' }, img, caption, captionMsg, k, del);
  t.dataset.id = pic.id;
  makeDraggable(t, img);
  return t;
}

function projectCard(p, initialPics, open, onListChange) {
  let pics = [...initialPics];

  const title = el('input', { type:'text', placeholder:'Project title, e.g. Steel boiler replacement, Bronx' });
  title.value = p.title || '';
  const category = choice('Category'), type = choice('Type'), size = choice('Job size');
  category.set(Object.keys(CATS), p.category);
  type.set(CATS[p.category] || [], p.subtype);
  size.set(SIZES, p.size);
  category.onchange(() => type.set(CATS[category.get()] || [], ''));

  const desc = el('textarea', { rows:'4', placeholder:'Describe the job: what was done, building type, anything worth showing off.' });
  desc.value = p.description || '';
  const pub = el('input', { type:'checkbox' }); pub.checked = p.published === true;

  const sumTitle = el('strong', {}), sumMeta = el('span', { class:'date' }), badge = el('span', { class:'badge' });
  const showSummary = (t, c, s, live) => {
    sumTitle.textContent = t || '(untitled)';
    sumMeta.textContent = [c, s].filter(Boolean).join(' · ');
    badge.textContent = live ? 'Live' : 'Draft';
    badge.className = 'badge' + (live ? ' live' : '');
  };
  showSummary(p.title, p.category, p.subtype, p.published === true);

  const msg = el('span', { class:'date' });
  const save = el('button', { onclick: async () => {
    msg.className = 'date'; msg.textContent = 'Saving…';
    const row = {
      title: title.value.trim() || 'Untitled',
      category: category.get(), subtype: type.get(), size: size.get(),
      description: desc.value.trim() || null,
      published: pub.checked,
    };
    const { error } = await sb.from('projects').update(row).eq('id', p.id);
    if (error) { msg.className = 'date err'; msg.textContent = 'Not saved: ' + error.message; return; }
    msg.textContent = row.published ? 'Saved. This project is live.' : 'Saved as a draft (not on the public page).';
    showSummary(row.title, row.category, row.subtype, row.published);
  }}, 'Save details');

  const d = el('details', { class:'row' });
  const delP = el('button', { class:'ghost', onclick: async () => {
    if (!confirm('Delete this whole project and all its photos? This cannot be undone.')) return;
    if (pics.length) await sb.storage.from(BUCKET).remove(pics.map(x => x.path));
    const { error } = await sb.from('projects').delete().eq('id', p.id);
    if (error) return alert('Could not delete: ' + error.message);
    d.remove(); onListChange();
  }}, 'Delete project');

  // Photos: added and removed in place, so nothing you typed above is lost
  const grid = el('div', { class:'thumbs' });
  enableOrdering(grid, 'project_photos', true);
  const none = el('p', { class:'msg', style:'padding:0' }, 'No photos yet.');
  const syncPics = () => { none.style.display = pics.length ? 'none' : ''; grid.style.display = pics.length ? '' : 'none'; };
  const addThumb = (pic) => grid.append(thumb(pic, (gone) => { pics = pics.filter(x => x.id !== gone.id); syncPics(); }));
  pics.forEach(addThumb); syncPics();

  const files = el('input', { type:'file', accept:'image/*', multiple:'' });
  const kind = el('select', { 'aria-label':'Label for new photos' }, kindOpts('photo'));
  const upMsg = el('span', { class:'date' });
  const up = el('button', { onclick: async () => {
    const fs = [...files.files];
    if (!fs.length) { upMsg.className = 'date err'; upMsg.textContent = 'Choose photos first.'; return; }
    up.disabled = true; upMsg.className = 'date';
    const failed = [];
    for (let i = 0; i < fs.length; i++) {
      upMsg.textContent = `Uploading ${i + 1} of ${fs.length}…`;
      try {
        const blob = await shrinkImage(fs[i]);
        const path = `${p.id}/${Date.now()}-${i}.jpg`;
        const u = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg' });
        if (u.error) throw u.error;
        const r = await sb.from('project_photos').insert({ project_id:p.id, path, kind:kind.value }).select().single();
        if (r.error) { await sb.storage.from(BUCKET).remove([path]); throw r.error; }
        pics.push(r.data); addThumb(r.data); syncPics();
      } catch (e) { failed.push(`${fs[i].name} (${e.message})`); }
    }
    files.value = ''; up.disabled = false;
    if (failed.length) { upMsg.className = 'date err'; upMsg.textContent = 'Not uploaded: ' + failed.join('; '); }
    else upMsg.textContent = `Uploaded ${fs.length} photo${fs.length > 1 ? 's' : ''}.`;
  }}, 'Upload photos');

  const sumBar = el('summary', { class:'dragsum', title:'Drag to change the order' }, el('span', { class:'grip', 'aria-hidden':'true' }, '⋮⋮'), sumTitle, badge, sumMeta);
  if (open) d.open = true;
  d.append(
    sumBar,
    el('div', { class:'edit' },
      field('Title', title),
      el('div', { class:'grid2' }, category.node, type.node, size.node),
      field('Description', desc),
      el('label', { class:'chk' }, pub, 'Live on the public Projects page (leave unticked to keep it as a draft)'),
      el('div', { class:'bar' }, save, msg, el('span', { style:'flex:1' }), delP),
      el('hr', { style:'border:0;border-top:1px solid var(--line);width:100%' }),
      el('strong', {}, 'Photos'),
      none, grid,
      el('div', { class:'bar' }, files, kind, up, upMsg)));
  d.dataset.id = p.id;
  makeDraggable(d, sumBar);
  return d;
}

sb.auth.onAuthStateChange((evt, session) => {
  // Run outside Supabase's auth callback lock. Repeated SIGNED_IN keeps the current editor intact.
  if (evt === 'SIGNED_OUT') { dashboardUser = null; showLogin(); }
  else if (evt === 'SIGNED_IN' && session?.user.id !== dashboardUser) setTimeout(start, 0);
});
let starting = false;
async function start() {
  if (starting) return;
  starting = true;
  try { await boot(); } catch(e) { showLogin('Could not start: ' + e.message); }
  finally { starting = false; }
}
start();
</script>
