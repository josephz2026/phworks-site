<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PH Works Admin</title>
<style>
  :root { --bg:#f5f6f7; --card:#fff; --ink:#1c2227; --muted:#667078; --line:#dde1e4; --accent:#0b5fa5; --new:#c2410c; --prog:#a16207; --done:#15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181b; --card:#1d2327; --ink:#e8ecef; --muted:#98a3ab; --line:#2f383e; --accent:#5aa9e6; --new:#fb923c; --prog:#facc15; --done:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.3rem; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .who { color:var(--muted); font-size:.9rem; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  input[type=email] { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .login { max-width:380px; margin:12vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px; }
  .login p { color:var(--muted); margin:.4rem 0 1rem; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .tabs button[aria-selected=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px; }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .top strong { font-size:1.05rem; }
  .date { color:var(--muted); font-size:.85rem; }
  dl { margin:0; display:grid; grid-template-columns:110px 1fr; gap:3px 10px; }
  dt { color:var(--muted); font-size:.9rem; }
  dd { margin:0; word-break:break-word; white-space:pre-wrap; }
  .files { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .files button { padding:5px 10px; font-size:.85rem; }
  .ctl { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start; }
  select, textarea { border:1px solid var(--line); border-radius:6px; padding:7px; background:var(--card); }
  textarea { flex:1; min-width:200px; min-height:38px; resize:vertical; }
  .s-new { color:var(--new); } .s-in-progress { color:var(--prog); } .s-done { color:var(--done); }
  .msg { color:var(--muted); padding:20px 0; }
  .err { color:#b91c1c; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  input[type=text] { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  details.row summary { cursor:pointer; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.live { color:var(--done); border-color:var(--done); }
  .edit { margin-top:12px; display:grid; gap:12px; }
  .fld { display:grid; gap:4px; } .fld > span { color:var(--muted); font-size:.9rem; }
  .fld select, .fld textarea { width:100%; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .thumb { display:grid; gap:6px; }
  .thumb img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .chk { display:flex; align-items:center; gap:8px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .date.err { color:#b91c1c; }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- Fill these two in (Supabase > Project Settings > API). The anon key is safe to be public. ----
const SUPABASE_URL = 'https://gycuakdoskxmmdjoyqxw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5Y3Vha2Rvc2t4bW1kam95cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTQyOTEsImV4cCI6MjEwOTQ5MDI5MX0.6FZxvZLFD1ZEMGTTzsSYNn9e5gmSRpu1-lxkek1isZY';

const PAGE = 'admin'; // 'admin' or 'staff'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// Each tab: which roles can open it, which table it reads, which fields to show
const VIEWS = [
  { key:'service', label:'Service', type:'service', roles:['admin','service'] },
  { key:'estimating', label:'Construction', type:'quote', roles:['admin','estimating'] },
  { key:'projects', label:'Projects', custom:true, roles:['admin'] },
  { key:'hr', label:'Careers', type:'application', roles:['admin','hr'] },
];
const STATUSES = ['new','in progress','done'];

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n; // text is always inserted as text, never as HTML
}

function showLogin(note) {
  const email = el('input', { type:'email', placeholder:'you@phworksinc.com', required:'', autocomplete:'username' });
  const pass = el('input', { type:'password', placeholder:'Password', required:'', autocomplete:'current-password' });
  const out = el('p', { class:'msg' }, note || '');
  const form = el('form', { class:'login', onsubmit: async (e) => {
    e.preventDefault();
    out.className = 'msg'; out.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    if (error) { out.className = 'msg err'; out.textContent = 'Sign-in failed: ' + error.message; }
  }},
    el('h1', {}, 'PH Works Admin'),
    el('p', {}, 'Sign in with your work email and password.'),
    email, el('div', { style:'height:10px' }), pass, el('div', { style:'height:12px' }),
    el('button', { type:'submit' }, 'Sign in'), out);
  app.replaceChildren(form);
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: role, error } = await sb.rpc('my_role');
  const staff = role ? { role } : null;
  if (error || !staff) {
    const who = session.user.email;
    await sb.auth.signOut();
    return showLogin(error
      ? 'Could not check access: ' + error.message
      : `${who} is signed in but not on the approved staff list. Ask Joseph to add it.`);
  }
  const isAdmin = staff.role === 'admin';
  if (PAGE === 'admin' && !isAdmin) { location.replace('staff.html'); return; }
  if (PAGE === 'staff' && isAdmin) { location.replace('admin.html'); return; }
  showDash(session.user.email, staff.role);
}

function showDash(email, role) {
  const views = VIEWS.filter(v => v.roles.includes(role));
  const list = el('div');
  const tabs = el('div', { class:'tabs', role:'tablist' });
  const select = (v) => {
    [...tabs.children].forEach(b => b.setAttribute('aria-selected', b.dataset.key === v.key));
    if (v.custom) renderProjects(list); else loadView(v, list);
  };
  views.forEach(v => tabs.append(el('button', { role:'tab', 'data-key':v.key, 'aria-selected':'false', onclick:() => select(v) }, v.label)));

  app.replaceChildren(
    el('header', {},
      el('div', {}, el('h1', {}, 'PH Works Admin'), el('div', { class:'who' }, email)),
      el('button', { class:'ghost', onclick: async () => { await sb.auth.signOut(); showLogin(); } }, 'Sign out')),
    tabs, list);
  select(views[0]);
}

async function loadView(v, list) {
  list.replaceChildren(el('p', { class:'msg' }, 'Loading…'));
  const { data, error } = await sb.from('submissions').select('*').eq('type', v.type).order('created_at', { ascending:false }).limit(200);
  if (error) return list.replaceChildren(el('p', { class:'msg err' }, 'Could not load: ' + error.message));
  if (!data.length) return list.replaceChildren(el('p', { class:'msg' }, 'Nothing here yet.'));
  list.replaceChildren(...data.map(r => card(v, r)));
}

function card(v, r) {
  const dl = el('dl');
  const add = (k, val) => { if (val) dl.append(el('dt', {}, k), el('dd', {}, String(val))); };
  add('Email', r.email); add('Phone', r.phone);
  for (const [k, val] of Object.entries(r.extra || {})) add(k, val);
  add('Message', r.message);

  const files = (r.files || []).length ? el('div', { class:'files' }, r.files.map((f, i) =>
    el('button', { class:'ghost', onclick: async () => {
      const { data, error } = await sb.storage.from('uploads').createSignedUrl(f.path, 300);
      if (error) return alert('Could not open file: ' + error.message);
      window.open(data.signedUrl, '_blank', 'noopener');
    }}, f.name || ('File ' + (i + 1))))) : null;

  const status = el('select', { 'aria-label':'Status' }, STATUSES.map(s => {
    const o = el('option', { value:s }, s); if (s === r.status) o.selected = true; return o;
  }));
  const notes = el('textarea', { placeholder:'Notes' }); notes.value = r.notes || '';
  const saved = el('span', { class:'date' });
  const save = async () => {
    saved.textContent = 'Saving…';
    const { error } = await sb.from('submissions').update({ status:status.value, notes:notes.value }).eq('id', r.id);
    saved.textContent = error ? 'Not saved: ' + error.message : 'Saved';
  };
  status.addEventListener('change', save);
  notes.addEventListener('blur', () => { if (notes.value !== (r.notes || '')) { r.notes = notes.value; save(); } });

  return el('div', { class:'row' },
    el('div', { class:'top' }, el('strong', {}, r.name || '(no name)'), el('span', { class:'date' }, new Date(r.created_at).toLocaleString())),
    dl, files, el('div', { class:'ctl' }, status, notes, saved));
}

// ---------- Projects manager (admin only) ----------
const CATS = {
  'Boiler': ['Steel', 'Copper fin', 'Atmospheric', 'High efficiency'],
  'Pumps': ['Booster', 'Sewer'],
  'New construction': ['Underground', 'Rough', 'Finish'],
  'Gas re-pipe': [],
};
const SIZES = ['Larger buildings', 'Single units', 'High-end homes'];
const KINDS = [['photo', 'Photo'], ['before', 'Before'], ['after', 'After']];
const BUCKET = 'project-photos';
const pubUrl = (path) => `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;

// Shrinks a photo to max 1800px JPEG so uploads are fast and stay under the 5 MB limit
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const r = Math.min(1, 1800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? ok(b) : bad(new Error('Could not convert ' + file.name)); }, 'image/jpeg', 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(u); bad(new Error('Could not read ' + file.name + ' (try a JPG or PNG)')); };
    im.src = u;
  });
}

const field = (label, ctl) => el('label', { class:'fld' }, el('span', {}, label), ctl);
const opts = (arr, cur, first) => [
  first ? el('option', { value:'' }, first) : null,
  ...arr.map(v => { const o = el('option', { value:v }, v); if (v === cur) o.selected = true; return o; }),
];
const kindOpts = (cur) => KINDS.map(([v, l]) => { const o = el('option', { value:v }, l); if (v === cur) o.selected = true; return o; });

async function renderProjects(list, openId) {
  list.replaceChildren(el('p', { class:'msg' }, 'Loading…'));
  const [p, ph] = await Promise.all([
    sb.from('projects').select('*').order('created_at', { ascending:false }),
    sb.from('project_photos').select('*').order('created_at', { ascending:true }),
  ]);
  const err = p.error || ph.error;
  if (err) return list.replaceChildren(el('p', { class:'msg err' }, 'Could not load projects: ' + err.message));
  const by = {};
  ph.data.forEach(x => (by[x.project_id] = by[x.project_id] || []).push(x));
  const refresh = (id) => renderProjects(list, id);
  const add = el('button', { onclick: async () => {
    const { data, error } = await sb.from('projects').insert({ title:'New project' }).select().single();
    if (error) return alert('Could not create: ' + error.message);
    refresh(data.id);
  }}, '+ New project');
  list.replaceChildren(
    el('div', { style:'margin-bottom:12px' }, add),
    ...(p.data.length
      ? p.data.map(x => projectCard(x, by[x.id] || [], refresh, x.id === openId))
      : [el('p', { class:'msg' }, 'No projects yet. Click “New project” to add one.')]));
}

function thumb(pic, refresh, pid) {
  const k = el('select', { 'aria-label':'Photo label' }, kindOpts(pic.kind));
  k.addEventListener('change', async () => {
    const { error } = await sb.from('project_photos').update({ kind:k.value }).eq('id', pic.id);
    if (error) alert('Could not change label: ' + error.message);
  });
  const del = el('button', { class:'ghost', onclick: async () => {
    if (!confirm('Delete this photo?')) return;
    await sb.storage.from(BUCKET).remove([pic.path]);
    const { error } = await sb.from('project_photos').delete().eq('id', pic.id);
    if (error) return alert('Could not delete: ' + error.message);
    refresh(pid);
  }}, 'Delete');
  return el('div', { class:'thumb' }, el('img', { src:pubUrl(pic.path), alt:'', loading:'lazy' }), k, del);
}

function projectCard(p, pics, refresh, open) {
  const title = el('input', { type:'text', placeholder:'Project title, e.g. Steel boiler replacement, Bronx' });
  title.value = p.title || '';
  const cat = el('select', {}, opts(Object.keys(CATS), p.category, 'Choose a category…'));
  const sub = el('select');
  const size = el('select', {}, opts(SIZES, p.size, '—'));
  const subF = field('Type', sub), sizeF = field('Job size', size);
  const fillSub = (cur) => {
    const types = CATS[cat.value] || [];
    sub.replaceChildren(...opts(types, cur, '—'));
    subF.style.display = types.length ? '' : 'none';
    sizeF.style.display = cat.value === 'New construction' ? '' : 'none';
  };
  fillSub(p.subtype);
  cat.addEventListener('change', () => fillSub(''));

  const desc = el('textarea', { rows:'4', placeholder:'Describe the job: what was done, building type, anything worth showing off.' });
  desc.value = p.description || '';
  const pub = el('input', { type:'checkbox' }); pub.checked = !!p.published;

  const sumTitle = el('strong', {}, p.title || '(untitled)');
  const sumMeta = el('span', { class:'date' });
  const badge = el('span', { class:'badge' });
  const showSummary = (t, c, s, live) => {
    sumTitle.textContent = t || '(untitled)';
    sumMeta.textContent = [c, s].filter(Boolean).join(' · ');
    badge.textContent = live ? 'Live' : 'Draft';
    badge.className = 'badge' + (live ? ' live' : '');
  };
  showSummary(p.title, p.category, p.subtype, p.published);

  const msg = el('span', { class:'date' });
  const save = el('button', { onclick: async () => {
    msg.className = 'date'; msg.textContent = 'Saving…';
    const row = {
      title: title.value.trim() || 'Untitled',
      category: cat.value || null,
      subtype: sub.value || null,
      size: cat.value === 'New construction' ? (size.value || null) : null,
      description: desc.value.trim() || null,
      published: pub.checked,
    };
    const { error } = await sb.from('projects').update(row).eq('id', p.id);
    if (error) { msg.className = 'date err'; msg.textContent = 'Not saved: ' + error.message; return; }
    msg.textContent = 'Saved';
    showSummary(row.title, row.category, row.subtype, row.published);
  }}, 'Save details');

  const delP = el('button', { class:'ghost', onclick: async () => {
    if (!confirm('Delete this whole project and all its photos? This cannot be undone.')) return;
    if (pics.length) await sb.storage.from(BUCKET).remove(pics.map(x => x.path));
    const { error } = await sb.from('projects').delete().eq('id', p.id);
    if (error) return alert('Could not delete: ' + error.message);
    refresh();
  }}, 'Delete project');

  const files = el('input', { type:'file', accept:'image/*', multiple:'' });
  const kind = el('select', { 'aria-label':'Label for new photos' }, kindOpts('photo'));
  const upMsg = el('span', { class:'date' });
  const up = el('button', { onclick: async () => {
    const fs = [...files.files];
    if (!fs.length) { upMsg.className = 'date err'; upMsg.textContent = 'Choose photos first.'; return; }
    up.disabled = true; upMsg.className = 'date';
    try {
      for (let i = 0; i < fs.length; i++) {
        upMsg.textContent = `Uploading ${i + 1} of ${fs.length}…`;
        const blob = await shrinkImage(fs[i]);
        const path = `${p.id}/${Date.now()}-${i}.jpg`;
        const u = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg' });
        if (u.error) throw u.error;
        const r = await sb.from('project_photos').insert({ project_id:p.id, path, kind:kind.value });
        if (r.error) throw r.error;
      }
      refresh(p.id);
    } catch (e) {
      upMsg.className = 'date err'; upMsg.textContent = 'Upload failed: ' + e.message; up.disabled = false;
    }
  }}, 'Upload photos');

  const d = el('details', { class:'row' });
  if (open) d.open = true;
  d.append(
    el('summary', {}, sumTitle, badge, sumMeta),
    el('div', { class:'edit' },
      field('Title', title),
      el('div', { class:'grid2' }, field('Category', cat), subF, sizeF),
      field('Description', desc),
      el('label', { class:'chk' }, pub, 'Show on the public Projects page'),
      el('div', { class:'bar' }, save, msg, el('span', { style:'flex:1' }), delP),
      el('hr', { style:'border:0;border-top:1px solid var(--line);width:100%' }),
      el('strong', {}, 'Photos'),
      pics.length ? el('div', { class:'thumbs' }, pics.map(x => thumb(x, refresh, p.id))) : el('p', { class:'msg', style:'padding:0' }, 'No photos yet.'),
      el('div', { class:'bar' }, files, kind, up, upMsg)));
  return d;
}

sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_IN') boot(); });
boot();
</script>
</body>
</html>
