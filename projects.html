<main><section><div class="wrap">

<script>
var mb=document.getElementById('mb'),nv=document.getElementById('nv');
mb.addEventListener('click',function(){var o=nv.classList.toggle('open');mb.setAttribute('aria-expanded',o)});
nv.addEventListener('click',function(e){if(e.target.tagName==='A'){nv.classList.remove('open');mb.setAttribute('aria-expanded','false')}});
</script>
<script src="supabase-config.js"></script>
<script>
/* Projects come from the admin page (admin.html). Add or edit them there. */
(function(){
var grid=document.getElementById('pgrid'),msg=document.getElementById('pmsg');
var catBox=document.getElementById('pcats'),subBox=document.getElementById('psubs');
var track=document.createElement('div');track.className='portfolio-track';grid.appendChild(track);
var lb=document.getElementById('lb'),box=document.getElementById('lbox');
var ORDER=['Boiler','Pumps','New construction','Gas re-pipes'];
var all=[],fCat='',fSub='';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i})}
function pills(wrap,items,cur,allLabel,on){
  wrap.innerHTML='';
  if(items.length<2)return;
  [''].concat(items).forEach(function(v){
    var b=el('button','',v||allLabel);b.type='button';b.setAttribute('aria-pressed',String(v===cur));
    b.addEventListener('click',function(){on(v)});wrap.appendChild(b);
  });
}
function filters(){
  var cats=uniq(all.map(function(p){return p.category})).sort(function(a,b){
    var i=ORDER.indexOf(a),j=ORDER.indexOf(b);
    if(i<0&&j<0)return a.localeCompare(b);if(i<0)return 1;if(j<0)return -1;return i-j});
  pills(catBox,cats,fCat,'All',function(v){fCat=v;fSub='';filters();render()});
  var subs=fCat?uniq(all.filter(function(p){return p.category===fCat}).map(function(p){return p.subtype})):[];
  pills(subBox,subs,fSub,'All '+fCat,function(v){fSub=v;filters();render()});
}
function render(){
  var list=all.filter(function(p){return(!fCat||p.category===fCat)&&(!fSub||p.subtype===fSub)});
  cancelAnimationFrame(carouselFrame);carouselGeneration++;
  track.innerHTML='';
  if(!list.length){document.getElementById('portfolio-controls').hidden=true;msg.style.display='';msg.textContent=all.length?'No projects here yet.':'Coming soon.';return}
  msg.style.display='none';
  list.forEach(function(p){
    var photos=p.photos||[];
    var b=el('button','proj');b.type='button';
    var cov=el('span','cov');cov.style.display='block';
    if(p.cover||photos[0]){var im=document.createElement('img');im.src=p.cover||photos[0].url;im.alt=p.title;im.loading='lazy';im.decoding='async';cov.appendChild(im)}
    var cap=el('span','cap');
    var meta=[p.category,p.subtype,p.size].filter(Boolean).join(' \u00b7 ');
    var n=photos.length+(photos.length===1?' photo':' photos');
    cap.appendChild(el('span','nm',p.title));
    cap.appendChild(el('span','ct',(meta?meta+' \u00b7 ':'')+n));
    cap.appendChild(el('span','view','View project photos \u2197'));
    b.setAttribute('aria-label',p.title+'. View project photos');
    b.appendChild(cov);b.appendChild(cap);
    b.addEventListener('click',function(e){
      if(carouselMoved){e.preventDefault();return}
      if(e.detail!==0 && !window.matchMedia('(hover: hover) and (pointer: fine)').matches && !b.classList.contains('is-revealed')){
        grid.querySelectorAll('.is-revealed').forEach(function(card){card.classList.remove('is-revealed')});
        b.classList.add('is-revealed');return;
      }
      open(p);
    });
    track.appendChild(b);
  });
  carouselPosition=0;setupCarousel();
}

// Use the homepage's translate3d track, 34 px/s base speed and velocity easing.
var carouselPaused=false,carouselHover=false,carouselTouch=false;
var controls=document.getElementById('portfolio-controls'),dots=document.getElementById('portfolio-dots');
var pauseButton=document.getElementById('portfolio-pause');
var carouselCount=0,carouselLoop=false,carouselGeneration=0,carouselUnit=0;
var carouselFrame=null,carouselTime=0,carouselPosition=0,carouselTarget=null;
var carouselSpeed=34,carouselVelocity=0,carouselMoved=false;
function carouselStep(){
  if(!carouselUnit&&track.children.length)carouselUnit=track.children[0].getBoundingClientRect().width+(parseFloat(getComputedStyle(track).gap)||0);
  return carouselUnit||1;
}
function carouselIndex(){return Math.round(carouselPosition/carouselStep())-(carouselLoop?carouselCount:0)}
function paintCarousel(){track.style.transform='translate3d('+(-carouselPosition)+'px,0,0)'}
function carouselMove(index){
  if(!carouselCount)return;
  carouselTarget=(index+(carouselLoop?carouselCount:0))*carouselStep();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){carouselPosition=carouselTarget;carouselTarget=null;normalizeCarousel();paintCarousel();syncCarousel()}
}
function normalizeCarousel(){
  if(!carouselLoop)return;
  var period=carouselCount*carouselStep();
  if(!period)return;
  var normalized=((carouselPosition-period)%period+period)%period+period;
  var shift=normalized-carouselPosition;
  carouselPosition=normalized;
  if(carouselTarget!==null)carouselTarget+=shift;
}
function animateCarousel(time){
  var dt=carouselTime?Math.min((time-carouselTime)/1000,.05):0;carouselTime=time;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rect=grid.getBoundingClientRect();
  var visible=!document.hidden&&!lb.classList.contains('on')&&rect.bottom>0&&rect.top<innerHeight;
  if(visible){
    if(!carouselTouch){
      if(carouselTarget!==null){
        carouselVelocity=0;
        var delta=carouselTarget-carouselPosition;
        carouselPosition+=delta*(1-Math.exp(-6*dt));
        if(Math.abs(delta)<.1){carouselPosition=carouselTarget;carouselTarget=null}
      }else{
        var base=carouselLoop&&!reduced&&!carouselPaused&&!carouselHover&&!grid.contains(document.activeElement)?carouselSpeed:0;
        carouselVelocity+=(base-carouselVelocity)*Math.min(1,dt*3);
        carouselPosition+=carouselVelocity*dt;
      }
    }
    normalizeCarousel();paintCarousel();syncCarousel();
  }
  carouselFrame=requestAnimationFrame(animateCarousel);
}
function syncCarousel(){
  var index=carouselCount?((carouselIndex()%carouselCount)+carouselCount)%carouselCount:0;
  dots.querySelectorAll('button').forEach(function(b,i){
    var current=String(i===index);if(b.getAttribute('aria-current')!==current)b.setAttribute('aria-current',current);
  });
  document.getElementById('portfolio-prev').disabled=!carouselLoop;
  document.getElementById('portfolio-next').disabled=!carouselLoop;
}
function setupCarousel(){
  cancelAnimationFrame(carouselFrame);carouselTime=0;carouselVelocity=0;carouselTarget=null;dots.innerHTML='';
  track.querySelectorAll('[data-carousel-clone]').forEach(function(node){node.remove()});
  var originals=Array.from(track.children);carouselCount=originals.length;carouselLoop=false;carouselUnit=0;
  var generation=++carouselGeneration;
  originals.forEach(function(card,i){var d=el('button');d.type='button';d.setAttribute('aria-label','Go to '+card.querySelector('.nm').textContent);d.addEventListener('click',function(){carouselMove(i)});dots.appendChild(d)});
  requestAnimationFrame(function(){
    if(generation!==carouselGeneration)return;
    var step=carouselStep();
    carouselLoop=carouselCount>1&&track.scrollWidth>grid.clientWidth-parseFloat(getComputedStyle(grid).paddingLeft)-parseFloat(getComputedStyle(grid).paddingRight)+2;
    if(carouselLoop){
      function copy(card){
        var clone=card.cloneNode(true);clone.classList.remove('is-revealed');clone.tabIndex=-1;clone.setAttribute('aria-hidden','true');clone.setAttribute('data-carousel-clone','');
        clone.addEventListener('click',function(e){
          if(carouselMoved){e.preventDefault();return}
          if(e.detail!==0&&!window.matchMedia('(hover: hover) and (pointer: fine)').matches&&!clone.classList.contains('is-revealed')){
            grid.querySelectorAll('.is-revealed').forEach(function(c){c.classList.remove('is-revealed')});clone.classList.add('is-revealed');return;
          }
          card.dispatchEvent(new MouseEvent('click',{bubbles:true,detail:0}));
        });return clone;
      }
      var before=document.createDocumentFragment(),after=document.createDocumentFragment();
      originals.forEach(function(card){before.appendChild(copy(card));after.appendChild(copy(card))});
      track.insertBefore(before,track.firstChild);track.appendChild(after);
      carouselPosition=carouselCount*step;
    }else carouselPosition=0;
    controls.hidden=!carouselLoop;syncCarousel();fitPortfolio();paintCarousel();carouselFrame=requestAnimationFrame(animateCarousel);
  });
}
// Match the homepage's pointer drag and gentle hover deceleration.
var pointerStart=0,pointerPosition=0,pointerDown=false,pointerId=null;
grid.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')carouselHover=true});
grid.addEventListener('pointerleave',function(){carouselHover=false});
grid.addEventListener('pointerdown',function(e){
  if(!carouselLoop||e.button!==0)return;
  pointerDown=true;pointerId=e.pointerId;carouselMoved=false;pointerStart=e.clientX;pointerPosition=carouselPosition;
});
window.addEventListener('pointermove',function(e){
  if(!pointerDown||e.pointerId!==pointerId)return;
  var dx=e.clientX-pointerStart;
  if(Math.abs(dx)>6&&!carouselTouch){carouselTouch=true;carouselMoved=true;carouselTarget=null;grid.classList.add('is-dragging');grid.setPointerCapture(e.pointerId)}
  if(carouselTouch){carouselPosition=pointerPosition-dx;carouselVelocity=0;paintCarousel()}
});
function finishCarouselDrag(e){
  if(!pointerDown||e.pointerId!==pointerId)return;
  pointerDown=false;carouselTouch=false;grid.classList.remove('is-dragging');
  if(grid.hasPointerCapture(e.pointerId))grid.releasePointerCapture(e.pointerId);
  normalizeCarousel();paintCarousel();
  setTimeout(function(){carouselMoved=false},0);
}
window.addEventListener('pointerup',finishCarouselDrag);
window.addEventListener('pointercancel',finishCarouselDrag);
grid.addEventListener('dragstart',function(e){e.preventDefault()});
function nudgeCarousel(direction){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){carouselMove(carouselIndex()+direction);return}
  carouselTarget=null;carouselVelocity+=direction*800;
}
document.getElementById('portfolio-prev').addEventListener('click',function(){nudgeCarousel(-1)});
document.getElementById('portfolio-next').addEventListener('click',function(){nudgeCarousel(1)});
pauseButton.addEventListener('click',function(){carouselPaused=!carouselPaused;pauseButton.textContent=carouselPaused?'\u25b6':'\u275a\u275a';pauseButton.setAttribute('aria-label',carouselPaused?'Resume automatic sliding':'Pause automatic sliding');pauseButton.setAttribute('aria-pressed',String(carouselPaused))});
var carouselResizeTimer=0,carouselWidth=grid.clientWidth;
window.addEventListener('resize',function(){
  if(grid.clientWidth===carouselWidth)return;
  carouselWidth=grid.clientWidth;clearTimeout(carouselResizeTimer);
  carouselResizeTimer=setTimeout(setupCarousel,150);
});

// Size cards from the actual header/filter heights, including wrapped filters.
function fitPortfolio(){
  var header=document.querySelector('.pg'),section=document.querySelector('main>section');
  var controls=document.getElementById('portfolio-controls');
  if(!header||!section||!track.children.length)return;
  var headerHeight=header.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--portfolio-header-height',headerHeight+'px');
  var sectionStyle=getComputedStyle(section),gridStyle=getComputedStyle(grid);
  var filterHeight=[catBox,subBox].reduce(function(total,node){var style=getComputedStyle(node);return total+node.getBoundingClientRect().height+parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0)},0);
  var controlHeight=controls.hidden?0:controls.getBoundingClientRect().height+parseFloat(getComputedStyle(controls).marginTop||0);
  var padding=parseFloat(sectionStyle.paddingTop)+parseFloat(sectionStyle.paddingBottom)+parseFloat(gridStyle.paddingTop)+parseFloat(gridStyle.paddingBottom)+parseFloat(gridStyle.marginTop);
  var available=document.documentElement.clientHeight-headerHeight-filterHeight-controlHeight-padding-12;
  document.documentElement.style.setProperty('--portfolio-card-height',Math.max(160,Math.min(500,available))+'px');
}
var portfolioResize=new ResizeObserver(function(){requestAnimationFrame(fitPortfolio)});
[document.querySelector('.pg'),catBox,subBox,document.getElementById('portfolio-controls')].forEach(function(node){portfolioResize.observe(node)});
window.addEventListener('resize',fitPortfolio);
if(document.fonts)document.fonts.ready.then(fitPortfolio);

var cur=null,idx=0;
var CH_L='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
var CH_R='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
var zoomFit=null;
window.addEventListener('resize',function(){if(zoomFit)zoomFit()});
function zoomable(st,im,canSwipe){
  var s=1,x=0,y=0,bw=0,bh=0,MAX=6,ptrs={},pinch=null,pinched=false,start=null;
  function apply(){
    var vw=st.clientWidth,vh=st.clientHeight,mx=Math.max(0,(bw*s-vw)/2),my=Math.max(0,(bh*s-vh)/2);
    x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y));
    im.style.transform=s===1?'':'translate('+x+'px,'+y+'px) scale('+s+')';
    st.classList.toggle('zoomed',s>1);
  }
  function fit(){
    var nw=im.naturalWidth,nh=im.naturalHeight;if(!nw||!nh)return;
    var f=Math.min(st.clientWidth/nw,st.clientHeight/nh);
    bw=nw*f;bh=nh*f;im.style.width=bw+'px';im.style.height=bh+'px';apply();
  }
  zoomFit=fit;im.addEventListener('load',fit);
  function zoomAt(px,py,ns){
    ns=Math.min(MAX,Math.max(1,ns));var r=ns/s;
    x=px-(px-x)*r;y=py-(py-y)*r;s=ns;if(s===1){x=0;y=0}apply();
  }
  function rel(e){var r=st.getBoundingClientRect();return{x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2}}
  st.addEventListener('wheel',function(e){
    e.preventDefault();
    var p=rel(e),dy=e.deltaMode===1?e.deltaY*33:e.deltaY;
    zoomAt(p.x,p.y,s*Math.exp(-dy*(e.ctrlKey?0.01:0.0018)));
  },{passive:false});
  st.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('.nav'))return;
    try{st.setPointerCapture(e.pointerId)}catch(_){}
    var p=rel(e);ptrs[e.pointerId]={x:p.x,y:p.y};
    var ids=Object.keys(ptrs);
    if(ids.length===1){pinched=false;start={x:e.clientX,y:e.clientY}}
    if(ids.length===2){pinched=true;var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
  });
  st.addEventListener('pointermove',function(e){
    var q=ptrs[e.pointerId];if(!q)return;
    var p=rel(e),ids=Object.keys(ptrs);
    if(ids.length>=2&&pinch){
      q.x=p.x;q.y=p.y;
      var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      x+=mx-pinch.mx;y+=my-pinch.my;
      zoomAt(mx,my,s*d/pinch.d);
      pinch.d=d;pinch.mx=mx;pinch.my=my;
    }else if(ids.length===1&&s>1){
      x+=p.x-q.x;y+=p.y-q.y;q.x=p.x;q.y=p.y;apply();
    }
  });
  function up(e){
    if(!ptrs[e.pointerId])return;
    delete ptrs[e.pointerId];pinch=null;
    if(!Object.keys(ptrs).length&&start){
      var dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
      if(canSwipe&&!pinched&&s===1&&e.type==='pointerup'&&e.pointerType==='touch'&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx<0?1:-1);
    }
  }
  st.addEventListener('pointerup',up);
  st.addEventListener('pointercancel',up);
}
function openHash(){
  var m=/^#p-(.+)$/.exec(location.hash);if(!m)return;
  var id=decodeURIComponent(m[1]);
  var p=all.filter(function(x){return String(x.id)===id})[0];
  if(p&&(p.photos||[]).length)open(p);
}
function show(){
  var photos=cur.photos||[],ph=photos[idx];
  box.innerHTML='';
  box.appendChild(el('h2','',cur.title));
  var meta=[cur.category,cur.subtype,cur.size].filter(Boolean).join(' \u00b7 ');
  if(meta)box.appendChild(el('p','meta',meta));
  if(cur.description)box.appendChild(el('p','desc',cur.description));
  if(!ph)return;
  var st=el('div','stage');
  var im=document.createElement('img');im.src=ph.url;im.alt=(ph.caption||cur.title)+' (photo '+(idx+1)+' of '+photos.length+')';
  st.appendChild(im);
  zoomable(st,im,photos.length>1);
  if(photos.length>1){
    var pv=el('button','nav pv');pv.type='button';pv.setAttribute('aria-label','Previous photo');pv.innerHTML=CH_L;pv.addEventListener('click',function(){go(-1)});
    var nx=el('button','nav nx');nx.type='button';nx.setAttribute('aria-label','Next photo');nx.innerHTML=CH_R;nx.addEventListener('click',function(){go(1)});
    st.appendChild(pv);st.appendChild(nx);
  }
  box.appendChild(st);
  // Keep the counter in the same place even when captions or labels differ.
  if(photos.length>1)box.appendChild(el('div','count',(idx+1)+' of '+photos.length));
  if(ph.label){var d=el('div');d.appendChild(el('span','tag',ph.label));box.appendChild(d)}
  if(ph.caption)box.appendChild(el('p','note',ph.caption));
  // preload neighbours so the arrows feel instant
  [1,-1].forEach(function(o){var n=photos[(idx+o+photos.length)%photos.length];if(n){var pi=new Image();pi.src=n.url}});
}
function go(d){var n=(cur.photos||[]).length;idx=(idx+d+n)%n;show()}
function open(p){
  cur=p;idx=0;show();
  lb.classList.add('on');lb.scrollTop=0;document.body.style.overflow='hidden';
}
function close(){lb.classList.remove('on');if(/^#p-/.test(location.hash)&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);document.body.style.overflow='';box.innerHTML=''}
document.getElementById('lx').addEventListener('click',close);
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight'&&cur&&cur.photos.length>1)go(1);if(e.key==='ArrowLeft'&&cur&&cur.photos.length>1)go(-1)});
if(typeof PHW_SUPABASE_URL==='undefined'||PHW_SUPABASE_URL.indexOf('YOUR-')>-1){msg.textContent='Coming soon.';return}
fetch(PHW_SUPABASE_URL+'/rest/v1/projects?published=eq.true&order=created_at.desc&select=*,project_photos(*)',{headers:{apikey:PHW_SUPABASE_KEY,Authorization:'Bearer '+PHW_SUPABASE_KEY}})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(rows){
    rows.sort(function(a,b){return (a.sort_order == null ? 2147483647 : a.sort_order) - (b.sort_order == null ? 2147483647 : b.sort_order)});
    all=rows.map(function(p){
      var pics=(p.project_photos||[]).slice().sort(function(a,b){return (a.sort_order == null ? 2147483647 : a.sort_order) - (b.sort_order == null ? 2147483647 : b.sort_order) || (a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0)});
      var cv=pics.filter(function(x){return x.is_cover})[0]||pics[0];
      p.cover=cv?PHW_SUPABASE_URL+'/storage/v1/object/public/project-photos/'+cv.path:'';
      p.photos=pics.map(function(x){return{url:PHW_SUPABASE_URL+'/storage/v1/object/public/project-photos/'+x.path,label:x.kind==='before'?'Before':x.kind==='after'?'After':'',caption:x.caption||''}});
      return p});
    filters();render();openHash();window.addEventListener('hashchange',openHash)})
  .catch(function(){msg.innerHTML='Projects are not loading right now. Please call us at <a href="tel:+17184141083">(718) 414-1083</a>.'});
})();
</script>
